name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -eo pipefail

# Actions are pinned to commit SHAs; Renovate keeps them current.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod   # caches modules and build cache, keyed on go.sum
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: vet and unit tests
        run: task test 2>&1 | tee unit.log
      - name: integration tests (root, network namespaces)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq nftables conntrack iputils-ping
          # Root reuses the runner's caches instead of starting empty.
          sudo env "PATH=$PATH" GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            task integration 2>&1 | tee integration.log
      - name: annotate test failures
        if: failure()
        run: |
          # One annotation per failed step with the failing tests' output, so
          # the cause shows on the run page without opening the log.
          for log in unit.log integration.log; do
            [ -f "$log" ] && grep -q -E '^(--- FAIL|FAIL|panic:)' "$log" || continue
            msg=$(grep -E -B2 -A25 '^\s*(--- FAIL|panic:)|_test\.go:[0-9]+:' "$log" | head -200 |
              sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=go test failed ($log)::$msg"
          done

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signed provenance and SBOM attestations on v* tags.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # Override with repository variables to publish elsewhere.
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
      IMAGE: ${{ vars.IMAGE || format('ghcr.io/{0}', github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # Layer cache in the GitHub Actions cache, so runs after the first
          # skip unchanged stages (e.g. the module download).
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Attestations name the pushed index by digest, so they cover every
      # platform; they are also pushed to the registry next to the image.
      - name: attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: generate SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-release-assets: false
      - name: attest SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true

  ipk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release assets on v* tags
      # Signed provenance and SBOM attestations on v* tags.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: build packages
        run: task ipk ${{ startsWith(github.ref, 'refs/tags/v') && 'VERSION=$GITHUB_REF_NAME' || '' }}
      - name: install and run on OpenWrt (procd)
        run: packaging/openwrt/smoke-test.sh bin/tunsel_*_x86_64.ipk bin/luci-app-tunsel_*_all.ipk
      - name: attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bin/*.ipk
      # One SBOM for all packages, from what they install: syft reads the Go
      # modules from each binary's build info.
      - name: unpack packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for ipk in bin/*.ipk; do
            dir=sbom-root/$(basename "$ipk" .ipk)
            mkdir -p "$dir"
            tar -xzOf "$ipk" ./data.tar.gz | tar -xz -C "$dir"
          done
      - name: generate SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-root
          format: spdx-json
          output-file: bin/tunsel.spdx.json
          upload-release-assets: false
      - name: attest SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bin/*.ipk
          sbom-path: bin/tunsel.spdx.json
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" bin/*.ipk bin/tunsel.spdx.json --clobber
